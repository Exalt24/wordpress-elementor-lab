name: tests
on:
  push:
    branches: [main, master]
  pull_request:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: SEO audit tests
        run: python tests/test_seo_audit.py
      - name: Keyword research tests
        run: python tests/test_keyword_research.py
      - name: AI visibility tests
        run: python tests/test_ai_visibility.py
      - name: OpenCart extension, PHP syntax
        run: find opencart/extension -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: OpenCart extension, markup tests
        run: php opencart/tests/test_markup.php
      - name: Bullion shop, PHP syntax
        run: find bullion-shop/mu-plugins -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Bullion shop, rule tests
        run: php bullion-shop/tests/test_logic.php
      - name: Bullion shop, script tests
        run: python bullion-shop/tests/test_scripts.py
      - name: Elementor manifest builder tests
        run: python tests/test_manifest_to_elementor.py
      - name: Elementor editor comparison tests
        run: node tests/test_editor_compare.cjs
      - name: Elementor draft route, PHP syntax and tree check tests
        run: |
          php -l wp/mu-plugins/elementor-draft-route.php
          php tests/test_elementor_route.php
      - name: Elementor browser script syntax
        run: |
          node --check scripts/verify_in_editor.cjs
          node --check scripts/editor_compare.cjs
      - name: Deliberate breakage check
        run: python tests/mutation_check.py
      - name: Genesis lab, install the PSD libraries
        run: pip install psd-tools pytoshop numpy six
      - name: Genesis lab, PSD converter tests and mutation controls
        run: python genesis-lab/tests/test_psd_to_page.py
      - name: Genesis lab, file checks for both themes
        run: |
          python genesis-lab/scripts/check_lab.py --offline --theme lab-classic
          python genesis-lab/scripts/check_lab.py --offline --theme lab-child
      - name: Genesis lab, deliberate breakage check
        run: python genesis-lab/scripts/mutation_check.py
      - name: Genesis lab, PHP syntax
        run: find genesis-lab/mu-plugins genesis-lab/child-theme genesis-lab/classic-child -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Genesis lab, industry filter tests and mutation controls
        run: python genesis-lab/tests/test_cases_filter.py
      - name: Genesis lab, filter script and browser driver syntax
        run: |
          node --check genesis-lab/mu-plugins/lab-core-assets/cases-filter.js
          node --check genesis-lab/scripts/check_filter.cjs
      - name: Moodle lab, offline tests (the live cases need the container and are skipped here)
        run: python moodle-lab/tests/test_moodle_cases.py offline
      - name: Moodle lab, deliberate breakage check on the diagnosis code
        run: python moodle-lab/tests/mutation_check.py
      - name: Moodle lab, PHP syntax and browser driver syntax
        run: |
          php -l moodle-lab/scripts/lab.php
          node --check moodle-lab/scripts/student_shot.cjs

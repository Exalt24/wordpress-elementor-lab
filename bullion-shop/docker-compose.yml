name: bullion
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp-local-only
      MARIADB_ROOT_PASSWORD: root-local-only
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  spot:
    image: python:3.12-slim
    command: ["python", "/lab/spot_server.py", "8090"]
    environment:
      LATENCY_MS: "150"
    volumes:
      - ./scripts/spot_server.py:/lab/spot_server.py:ro
    ports:
      - "8090:8090"

  wordpress:
    image: wordpress:7-apache
    depends_on:
      db:
        condition: service_healthy
      spot:
        condition: service_started
    ports:
      - "8089:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-local-only
      WORDPRESS_DB_NAME: wp
      # Lab only: the site answers on whatever host name it is reached by (localhost from the browser, the service name from the Lighthouse container).
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', isset($$_SERVER['HTTP_HOST']) ? 'http://' . $$_SERVER['HTTP_HOST'] : 'http://localhost:8089');
        define('WP_SITEURL', WP_HOME);
      BULLION_PRICE_MODE: ${BULLION_PRICE_MODE:-cached}
      BULLION_HARDENING: ${BULLION_HARDENING:-on}
      BULLION_ASSETS: ${BULLION_ASSETS:-lean}
      BULLION_FEED_URL: http://spot:8090/spot
      BULLION_TTL: ${BULLION_TTL:-10}
      BULLION_STALE_MAX: ${BULLION_STALE_MAX:-40}
    volumes:
      - wpdata:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  cli:
    image: wordpress:cli
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-local-only
      WORDPRESS_DB_NAME: wp
      BULLION_FEED_URL: http://spot:8090/spot
    volumes:
      - wpdata:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./scripts:/lab-scripts:ro
      - ./build:/lab-build:ro
    profiles: ["tools"]

volumes:
  dbdata:
  wpdata:

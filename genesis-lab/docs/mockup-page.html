<style>
:root{--mock-bg:#f4f7fa;--mock-band:#102a43;--mock-headline:#ffffff;--mock-sub:#c8d6e5;--mock-cta:#e85d04;--mock-photo:#7b9ea8}
.mock{background:var(--mock-bg);padding:5px 0}
.mock-band{background:var(--mock-band);display:grid;grid-template-columns:61% 39%;gap:60px;align-items:center;padding:120px 80px}
.mock-text h1{color:var(--mock-headline);font-size:clamp(28px,4vw,48px);margin:0 0 16px}
.mock-text p{color:var(--mock-sub);font-size:18px;margin:0 0 24px}
.mock-text a{display:inline-block;background:var(--mock-cta);color:#fff;padding:18px 32px;border-radius:6px;text-decoration:none;font-weight:700}
.mock-photo{background:var(--mock-photo);min-height:288px;border-radius:6px}
@media (max-width:700px){.mock-band{grid-template-columns:1fr;padding:32px 20px}}
